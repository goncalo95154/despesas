<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02403D">
<title>Despesas Família</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --verde: #02403D; --lime: #D9FF00; --muted: #ADC7C7; }
html, body { width: 100%; height: 100%; background: var(--verde); font-family: -apple-system, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; min-height: 100vh; min-height: -webkit-fill-available; }
.hdr { background: var(--verde); padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.hdr-icon { width: 40px; height: 40px; border-radius: 11px; background: var(--lime); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.hdr h1 { color: var(--lime); font-size: 17px; font-weight: 700; }
.hdr p  { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card { background: white; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom, 24px); }
.body { padding: 22px 18px 48px; }
.field { margin-bottom: 18px; }
label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 8px; }
.opt { color: #ccc; font-weight: 400; }
.amount-wrap { position: relative; }
.sym { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 700; color: #ccc; pointer-events: none; transition: color .15s; }
input[type=number] { width: 100%; padding: 14px 14px 14px 36px; font-size: 26px; font-weight: 700; color: var(--verde); border: 1.5px solid #e0e0e0; border-radius: 13px; background: #fafafa; font-family: inherit; outline: none; -webkit-appearance: none; }
input[type=number]:focus { border-color: var(--verde); }
input[type=date], textarea { width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid #e0e0e0; border-radius: 13px; background: #fafafa; color: #111; font-family: inherit; outline: none; -webkit-appearance: none; }
input[type=date]:focus, textarea:focus { border-color: var(--verde); }
textarea { min-height: 68px; resize: vertical; }
.section-label { font-size: 11px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 8px; }
.cat-grid { display: grid; gap: 8px; }
.cat-btn { padding: 11px 6px 10px; border: 1.5px solid #e8e8e8; border-radius: 12px; background: #fafafa; color: #666; font-size: 12px; cursor: pointer; text-align: center; font-family: inherit; line-height: 1.3; -webkit-tap-highlight-color: transparent; }
.cat-icon { display: block; font-size: 18px; margin-bottom: 4px; }
.btn-submit { width: 100%; padding: 17px; border: none; border-radius: 14px; background: var(--verde); color: var(--lime); font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
.btn-submit:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }
.btn-submit:active:not(:disabled) { opacity: .85; }
/* loading */
.loading { text-align: center; padding: 60px 20px; color: #aaa; font-size: 15px; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top: 3px solid var(--verde); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
/* overlay dup */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
.overlay.show { display: flex; }
.dup-card { background: white; border-radius: 20px; padding: 26px 22px; max-width: 400px; width: 100%; }
.dup-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.dup-card p { font-size: 14px; color: #555; margin-bottom: 14px; line-height: 1.6; }
.dup-hint { background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #795548; margin-bottom: 18px; }
.dup-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dup-btns button { padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-cancel { border: 1.5px solid #ddd; background: white; color: #555; }
.btn-confirm { border: none; background: var(--verde); color: var(--lime); }
/* sucesso */
.success-view { padding: 40px 20px 48px; text-align: center; display: none; }
.success-circle { width: 72px; height: 72px; border-radius: 50%; background: #e8f5e9; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.success-view h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.success-view > p { font-size: 14px; color: #888; margin-bottom: 26px; }
.summary-card { background: #f8f8f8; border-radius: 14px; padding: 14px 18px; text-align: left; margin-bottom: 24px; }
.s-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #efefef; }
.s-row:last-child { border-bottom: none; }
.s-label { font-size: 13px; color: #999; }
.s-val { font-size: 14px; font-weight: 600; color: #111; text-align: right; }
.s-valor { font-size: 22px; font-weight: 800; color: var(--verde); }
.btn-reset { width: 100%; padding: 15px; border: 1.5px solid #e0e0e0; border-radius: 14px; background: white; color: #333; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 18px; height: 18px; border: 2.5px solid rgba(217,255,0,.3); border-top: 2.5px solid var(--lime); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">💸</div>
  <div>
    <h1>Despesas Família</h1>
    <p>Partilhado · sincroniza com Google Sheets</p>
  </div>
</div>

<div class="card">

  <!-- loading inicial -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    A carregar categorias...
  </div>

  <!-- formulário (preenchido via JS) -->
  <div class="body" id="form-view" style="display:none">
    <div class="field">
      <label>Valor</label>
      <div class="amount-wrap">
        <span class="sym" id="sym">€</span>
        <input type="number" id="valor" min="0" step="0.01" placeholder="0,00"
          oninput="document.getElementById('sym').style.color=this.value?'#02403D':'#ccc'">
      </div>
    </div>

    <div class="field">
      <label>Categoria</label>
      <div id="categorias-container"></div>
    </div>

    <div class="field">
      <label>Descrição <span class="opt">(opcional)</span></label>
      <textarea id="desc" placeholder="ex: Continente, fatura EDP..."></textarea>
    </div>

    <div class="field">
      <label>Data</label>
      <input type="date" id="data">
    </div>

    <button class="btn-submit" id="btn-submit" onclick="enviar(false)">
      Registar despesa
    </button>
  </div>

  <!-- overlay duplicado -->
  <div class="overlay" id="overlay-dup">
    <div class="dup-card">
      <h3>⚠️ Possível duplicado</h3>
      <p id="dup-msg"></p>
      <div class="dup-hint">💡 Podes ter registado o mesmo que a tua mulher, ou vice-versa.</div>
      <div class="dup-btns">
        <button class="btn-cancel" onclick="fecharDup()">Cancelar</button>
        <button class="btn-confirm" onclick="enviar(true)">Registar mesmo assim</button>
      </div>
    </div>
  </div>

  <!-- sucesso -->
  <div class="success-view" id="success-view">
    <div class="success-circle">✅</div>
    <h2>Despesa registada!</h2>
    <p>Adicionada à Google Sheet partilhada</p>
    <div class="summary-card" id="summary-card"></div>
    <button class="btn-reset" onclick="resetForm()">+ Registar outra despesa</button>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzwHrrzSkWEQBkD2ipcKZeoz8PylP_RBRGXX7TAvYMnTn_PdrpDIwQeSK8qD-Xx6_yj/exec';

const ICONES = {
  'Alimentação / Supermercado': '🛒',
  'Restaurantes / Cafés': '☕',
  'Renda': '🏠', 'Água': '💧', 'Luz': '⚡', 'Gás': '🔥', 'Casa': '🔧',
  'Trabalho · Renda Ginásio': '💪', 'Trabalho · Segurança Social': '🏛️', 'Trabalho · Extra': '💼',
  'Transportes / Combustível': '🚗', 'Saúde / Farmácia': '💊',
  'Lazer / Entretenimento': '🎬', 'Roupa / Compras': '👕',
};

const CORES = {
  'Alimentação':      { bg: '#e8f5e9', accent: '#2e7d32' },
  'Casa':             { bg: '#e3f2fd', accent: '#1565c0' },
  'Trabalho Gonçalo': { bg: '#ede7f6', accent: '#4527a0' },
  'Pessoal':          { bg: '#fff8e1', accent: '#e65100' },
};

const LABELS = {
  'Alimentação / Supermercado': 'Supermercado',
  'Restaurantes / Cafés': 'Restaurantes',
  'Transportes / Combustível': 'Transportes',
  'Trabalho · Renda Ginásio': 'Renda Ginásio',
  'Trabalho · Segurança Social': 'Seg. Social',
  'Trabalho · Extra': 'Extra',
  'Saúde / Farmácia': 'Saúde',
  'Lazer / Entretenimento': 'Lazer',
  'Roupa / Compras': 'Roupa',
  'Casa': 'Casa (extra)',
};

let cat = '';
document.getElementById('data').value = new Date().toISOString().split('T')[0];

// ── Carrega categorias via JSONP ──────────────────────────────────────
function carregarCategorias() {
  const script = document.createElement('script');
  script.src = SCRIPT_URL + '?callback=renderCategorias';
  script.onerror = function() {
    document.getElementById('loading').innerHTML =
      '<p style="color:#e53935;font-size:14px">Erro ao carregar categorias.<br>Verifica a ligação e recarrega.</p>';
  };
  document.head.appendChild(script);
}

function renderCategorias(grupos) {
  const container = document.getElementById('categorias-container');
  let html = '';

  for (const grupo in grupos) {
    const cats = grupos[grupo];
    const cor  = CORES[grupo] || { bg: '#f5f5f5', accent: '#555' };
    const cols = cats.length <= 2 ? 2 : 3;

    html += '<div class="section-label">' + grupo + '</div>';
    html += '<div class="cat-grid" style="grid-template-columns:repeat(' + cols + ',1fr)">';
    cats.forEach(function(c) {
      const label  = LABELS[c] || c;
      const icone  = ICONES[c] || '📌';
      html += '<button class="cat-btn" data-cat="' + c + '" data-bg="' + cor.bg + '" data-accent="' + cor.accent + '" onclick="sel(this)">';
      html += '<span class="cat-icon">' + icone + '</span>' + label + '</button>';
    });
    html += '</div>';
  }

  container.innerHTML = html;
  document.getElementById('loading').style.display   = 'none';
  document.getElementById('form-view').style.display = 'block';
}

// ── Selecionar categoria ──────────────────────────────────────────────
function sel(btn) {
  document.querySelectorAll('.cat-btn').forEach(function(b) {
    b.style.background  = '#fafafa';
    b.style.borderColor = '#e8e8e8';
    b.style.color       = '#666';
    b.style.fontWeight  = '400';
    b.style.transform   = 'scale(1)';
  });
  btn.style.background  = btn.dataset.bg;
  btn.style.borderColor = btn.dataset.accent;
  btn.style.color       = btn.dataset.accent;
  btn.style.fontWeight  = '700';
  btn.style.transform   = 'scale(1.04)';
  cat = btn.dataset.cat;
}

// ── Enviar despesa ────────────────────────────────────────────────────
function enviar(confirmar) {
  const valor = document.getElementById('valor').value;
  const desc  = document.getElementById('desc').value;
  const data  = document.getElementById('data').value;
  if (!valor || !cat) { alert('Preenche o valor e seleciona uma categoria.'); return; }

  fecharDup();
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> A registar...';

  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ valor, categoria: cat, descricao: desc, data, confirmar: confirmar || false })
  })
  .then(function() {
    // no-cors: não conseguimos ler a resposta, mas o pedido chegou
    const fmt = new Date(data + 'T12:00:00').toLocaleDateString('pt-PT', { day:'2-digit', month:'long', year:'numeric' });
    document.getElementById('summary-card').innerHTML =
      row('Valor',     '<span class="s-valor">€' + parseFloat(valor).toFixed(2) + '</span>') +
      row('Categoria', cat) +
      (desc ? row('Descrição', desc) : '') +
      row('Data', fmt);
    document.getElementById('form-view').style.display   = 'none';
    document.getElementById('success-view').style.display = 'block';
  })
  .catch(function() {
    alert('Erro de ligação. Verifica o internet e tenta novamente.');
  })
  .finally(function() {
    btn.disabled = false;
    btn.textContent = 'Registar despesa';
  });
}

function row(label, val) {
  return '<div class="s-row"><span class="s-label">' + label + '</span><span class="s-val">' + val + '</span></div>';
}

function fecharDup() {
  document.getElementById('overlay-dup').classList.remove('show');
}

function resetForm() {
  document.getElementById('valor').value = '';
  document.getElementById('desc').value  = '';
  document.getElementById('data').value  = new Date().toISOString().split('T')[0];
  document.getElementById('sym').style.color = '#ccc';
  document.querySelectorAll('.cat-btn').forEach(function(b) {
    b.style.background  = '#fafafa';
    b.style.borderColor = '#e8e8e8';
    b.style.color       = '#666';
    b.style.fontWeight  = '400';
    b.style.transform   = 'scale(1)';
  });
  cat = '';
  document.getElementById('form-view').style.display   = 'block';
  document.getElementById('success-view').style.display = 'none';
}

// Iniciar
carregarCategorias();
</script>
</body>
</html>
